[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-funnel"
version = "0.1.0"
description = "Modularer Sales Lead Generator mit autonomen Agenten"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
sales-funnel = "sales_funnel.cli:main"

[tool.setuptools.packages.find]
include = ["sales_funnel*"]
